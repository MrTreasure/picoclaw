# pico.mrtreasure.cc — authenticated PicoClaw PWA / WebSocket proxy
server {
    listen 80;
    listen [::]:80;
    server_name pico.mrtreasure.cc;
    server_tokens off;
    client_max_body_size 24m;

    include /etc/nginx/sites/blocked-clients.inc;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' wss://pico.mrtreasure.cc" always;

    access_log /var/log/nginx/picoclaw_pwa_access.log main;

    location = /ping {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "pong";
    }

    location = /sw.js {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://172.21.0.1:18800;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location /pico/ws {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://172.21.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://172.21.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
