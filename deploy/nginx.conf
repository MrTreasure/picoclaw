# pwa.mrtreasure.cc — authenticated MuseC137 PWA / WebSocket proxy
server {
    listen 80;
    listen [::]:80;
    server_name pwa.mrtreasure.cc;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 24m;
    root /usr/share/nginx/html/musec137-pwa;
    index index.html;

    include /etc/nginx/sites/blocked-clients.inc;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' wss://pwa.mrtreasure.cc" always;

    access_log /var/log/nginx/musec137_pwa_access.log main;

    location = /ping {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "pong";
    }

    # Login/status must stay at the launcher. Only protected HTML navigations
    # require a session here; public SPA bootstrap and fingerprinted assets do not.
    location = /_pwa_auth {
        internal;
        proxy_pass http://172.21.0.1:18801/api/models;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    error_page 401 = @pwa_login;
    location @pwa_login {
        return 302 /launcher-login;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /index.html {
        auth_request /_pwa_auth;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /launcher-login {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /launcher-setup {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /offline.html { try_files $uri =404; }
    location = /site.webmanifest { default_type application/manifest+json; try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = /favicon-96x96.png { try_files $uri =404; }
    location = /apple-touch-icon.png { try_files $uri =404; }
    location = /web-app-manifest-192x192.png { try_files $uri =404; }
    location = /web-app-manifest-512x512.png { try_files $uri =404; }

    location /pico/ws {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://172.21.0.1:18801;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /api/codex/app-server/ws {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://172.21.0.1:18801;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Missing files never fall through to the SPA HTML.
    location ~ \.[^/]+$ { try_files $uri =404; }

    # API/media/session authorization remains enforced by the launcher.
    location ^~ /api/ {
        proxy_pass http://172.21.0.1:18801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /pico/ {
        proxy_pass http://172.21.0.1:18801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Preserve the launcher's one-shot/device login and logout behavior.
    location = /launcher-auto-login {
        proxy_pass http://172.21.0.1:18801;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
    location = /android-webview-login {
        proxy_pass http://172.21.0.1:18801;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location / {
        auth_request /_pwa_auth;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
