<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#171717" />
    <title>MuseC137 · 离线</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f7f5;
        color: #171717;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid #deded9;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 64px rgb(0 0 0 / 8%);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 24px;
        color: #62625e;
        line-height: 1.65;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #171717;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #737373;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111;
          color: #fafafa;
        }
        main {
          background: #1b1b1b;
          border-color: #333;
        }
        p {
          color: #b7b7b2;
        }
        button {
          background: #fafafa;
          color: #171717;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/web-app-manifest-192x192.png" alt="" />
      <h1>当前处于离线状态</h1>
      <p>
        MuseC137 已安装，但聊天需要连接 C137
        异次元实验室服务。恢复网络后即可继续。
      </p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
